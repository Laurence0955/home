<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Family Hub</title>
    <style>
        /* This makes the website look clean, modern, and friendly */
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f7f9fc; color: #333; margin: 0; padding: 0; }
        header { background: linear-gradient(135deg, #6c5ce7, #a29bfe); color: white; padding: 30px 20px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { margin: 0; font-size: 2.5rem; }
        p { margin: 5px 0 0 0; opacity: 0.9; }
        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        @media (max-width: 800px) { .container { grid-template-columns: 1fr; } } /* Makes it work perfectly on phones */
        .card { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); }
        h2 { color: #6c5ce7; margin-top: 0; border-bottom: 2px solid #f1f2f6; padding-bottom: 10px; }
        iframe { width: 100%; border: none; border-radius: 8px; background: white; }
    </style>
</head>
<body>

    <header>
        <h1>Our Family Hub 🏠</h1>
        <p>Our shared space for calendars, schedules, and memories.</p>
    </header>

    <div class="container">
        
        <!-- LEFT SIDE: THE SYNCED CALENDAR -->
        <div class="card">
            <h2>📅 Family Schedule & Calendar</h2>
            <!-- This is a placeholder. We will replace this with your real family calendar link next! -->
            <iframe src="https://calendar.google.com/calendar/embed?src=en.philippines%23holiday%40group.v.calendar.google.com&ctz=Asia%2FManila" style="border: 0" width="100%" height="450" frameborder="0" scrolling="no"></iframe>
        </div>

        <!-- RIGHT SIDE: THE DIARY -->
        <div class="card">
            <h2>📖 Family Memory Diary</h2>
            <p>Type a memory below to share it with everyone instantly!</p>
            <br>
            <!-- This is where your family will write. We will link your private form here next. -->
            <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSf6gT77OEcUep2fB1b1S-Wwsh4rZgL3xepn_hCHpXb_m8BfBw/viewform?embedded=true" width="100%" height="400" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
        </div>

    </div>

</body>
</html>
